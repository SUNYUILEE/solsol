schema_version: "2.0.1"
standard: "PRODUCT_QUALITY_STANDARD.md"
report_schema: "QUALITY_REPORT.schema.json"
purpose: "기능·연구 무결성·상용 UI 품질을 함께 판정하는 완료 exit gate"

evaluation:
  profiles: [CONTINUOUS_RESEARCH, CHANGE_INTEGRATION, PRODUCT_EXIT]
  product_exit_triggers: [whole_product_completion_claim, release_candidate_claim, release_claim, deployable_final_delivery]
  scoped_triggers: [research_iteration, research_result_delivery, change_integration, feature_completion]
  statuses: [PASS, FAIL, NOT_RUN, BLOCKED, NOT_APPLICABLE]
  passing_statuses: [PASS, NOT_APPLICABLE]
  development_mode: "개발 중에는 비차단. 완료·출시급·상용 수준 주장 시에만 전체 필수 gate를 적용한다."
  completion_rule: "PRODUCT_EXIT에서 모든 적용 필수 gate가 PASS 또는 승인된 NOT_APPLICABLE이고, 미해결 BLOCKER/MAJOR가 없으며, 2.0.1 보고서가 schema를 통과해야 프로그램 전체 PASS다."
  missing_evidence: "NOT_RUN"
  stale_evidence: "증거 revision이 대상과 다르거나 UI 참조 조사가 90일을 넘으면 관련 check를 NOT_RUN으로 되돌린다."

profile_rules:
  CONTINUOUS_RESEARCH:
    intent: "연구 반복을 계속하면서 결과 무결성을 보호한다."
    always_apply_gates: [QG-00, QG-02, QG-03]
    apply_relevant_checks_from: [QG-04, QG-05, QG-07, QG-11]
    do_not_require_by_default: [QG-01, QG-06, QG-08, QG-09, QG-10, QG-12]
    blocking_scope: "BLOCKER는 해당 결과의 인용·비교·통합을 막지만 안전한 별도 연구까지 중단시키지 않는다."
    reporting: "기존 연구기록에 적용 check와 증거를 기록한다. 전체 13-gate product report는 요구하지 않는다."
  CHANGE_INTEGRATION:
    intent: "변경을 프로그램에 합칠 때 영향 범위를 검증한다."
    always_apply_gates: [QG-00, QG-12]
    apply: "변경 영향표에 해당하는 gate/check의 합집합"
    ui_change_rule: "UI 변경이면 QG-06의 관련 check와 실제 screenshot을 실행한다. 중대한 UI 재설계면 QG-06 전체를 실행한다."
    scientific_change_rule: "목적·제약·수선·알고리즘·공간평가 변경이면 QG-02~QG-04 전체를 실행한다."
    blocking_scope: "실패는 해당 변경의 통합 완료를 막지만 독립된 연구 반복까지 중단시키지 않는다."
  PRODUCT_EXIT:
    intent: "프로그램 전체의 완료·출시급·상용 수준을 판정한다."
    required_gates: [QG-00, QG-01, QG-02, QG-03, QG-04, QG-05, QG-06, QG-07, QG-08, QG-09, QG-10, QG-11, QG-12]
    report_required: true
    blocking_scope: "필수 FAIL/NOT_RUN/BLOCKED가 있으면 프로그램 전체 완료·출시급 선언을 막는다. 연구 자체는 계속할 수 있다."

severity_policy:
  BLOCKER: {completion_blocking: true, waiver_allowed: false}
  MAJOR: {completion_blocking: true, waiver_allowed: false}
  MINOR: {completion_blocking: true, waiver_allowed: true}
  ADVISORY: {completion_blocking: false, track_in_backlog: true}

evidence_contract:
  required_fields: [id, kind, path_or_uri, produced_at, target_revision, description]
  accepted_kinds:
    - command_log
    - test_report
    - coverage_report
    - screenshot
    - visual_regression
    - manual_check
    - usability_report
    - design_brief
    - prototype
    - reference_research
    - raw_run
    - exported_evidence
    - hash_manifest
    - benchmark
    - decision_record
    - risk_record

gates:
  - id: QG-00
    name: "대상·최신 연구 상태·범위 고정"
    required: true
    checks:
      - id: QG-00-01
        severity: BLOCKER
        requirement: "대상 파일·배포물, version/commit, 환경과 hash가 고정되어 있다."
      - id: QG-00-02
        severity: BLOCKER
        requirement: "최신 승인 연구 상태·모델 계약·결정 기록을 읽고 판정 기준 revision을 기록했다."
      - id: QG-00-03
        severity: MAJOR
        requirement: "요청, 수용기준, 범위 밖 항목, 변경 파일과 영향 gate가 추적 가능하다."
      - id: QG-00-04
        severity: MAJOR
        requirement: "과거 PDF/화면과 최신 연구 상태의 차이를 기록했으며 PDF layout을 디자인 계약으로 취급하지 않았다."
      - id: QG-00-05
        severity: MAJOR
        requirement: "기존 운영·연구기록을 보존하고 이 패키지를 완료 판정층으로 통합했다."
    minimum_evidence: [decision_record, command_log]

  - id: QG-01
    name: "시작·핵심 기능·상태 연결"
    required: true
    checks:
      - id: QG-01-01
        severity: BLOCKER
        requirement: "문서화된 단일 절차로 깨끗한 지원 환경에서 시작된다."
      - id: QG-01-02
        severity: BLOCKER
        requirement: "저장 실행 탐색→설정→실행→모니터→해 탐색→비교·내보내기의 실제 end-to-end 흐름이 통과한다."
      - id: QG-01-03
        severity: BLOCKER
        requirement: "현재 결과 조건과 다음 실행 입력이 섞이지 않고 기존 결과가 소급 변경되지 않는다."
      - id: QG-01-04
        severity: BLOCKER
        requirement: "목록·plot·지도·inspector·표·download가 동일 run ID와 solution ID를 가리킨다."
      - id: QG-01-05
        severity: MAJOR
        requirement: "미선택·미실행·값 없음은 0값 결과로 대체되지 않는다."
      - id: QG-01-06
        severity: MAJOR
        requirement: "경계값, empty, infeasible, invalid input, 최대 지원 크기에 명확히 대응한다."
    minimum_evidence: [test_report, screenshot, manual_check]

  - id: QG-02
    name: "연구·수학·주장 무결성"
    required: true
    checks:
      - id: QG-02-01
        severity: BLOCKER
        requirement: "목적식, 단위, 정규화, 탐지·식별·비용 의미가 코드·UI·export·문서에서 일치한다."
      - id: QG-02-02
        severity: BLOCKER
        requirement: "목표·제약·자원 규칙·수선이 목적값과 구분되고 A/B/C 표현에 일관 적용된다."
      - id: QG-02-03
        severity: BLOCKER
        requirement: "관측 최저, best-known, LP bound, MILP bound/feasible 해, Pareto optimality, global optimality를 구분한다."
      - id: QG-02-04
        severity: BLOCKER
        requirement: "세대 완료·시간 제한·휴리스틱 종료를 전역 최적성 인증으로 표현하지 않는다."
      - id: QG-02-05
        severity: MAJOR
        requirement: "representation-operator 조합과 가능한 물리 배치공간의 동등성 또는 차이를 검증했다."
      - id: QG-02-06
        severity: MAJOR
        requirement: "0세대 주입 성능과 진화 이후 개선을 계보·세대·NFE로 분리한다."
      - id: QG-02-07
        severity: MAJOR
        requirement: "합성 비용·합성 지도·가정과 사용 금지 범위를 공개한다."
    minimum_evidence: [test_report, raw_run, decision_record]

  - id: QG-03
    name: "실행 계보·데이터 무결성"
    required: true
    checks:
      - id: QG-03-01
        severity: BLOCKER
        requirement: "각 실행에 ID, code revision, input snapshot, seed, 환경, 시각, 종료 사유가 있다."
      - id: QG-03-02
        severity: BLOCKER
        requirement: "목적값·제약·유전자/좌표·세대·생성 출처·생존 상태를 역추적할 수 있다."
      - id: QG-03-03
        severity: BLOCKER
        requirement: "준비 평가/시간/solver 호출과 진화 NFE/시간을 분리 저장·표시한다."
      - id: QG-03-04
        severity: BLOCKER
        requirement: "실행 간 데이터 혼합, ID 재사용, 부분 덮어쓰기가 없다."
      - id: QG-03-05
        severity: MAJOR
        requirement: "export에 schema version, manifest, size, SHA-256이 있다."
      - id: QG-03-06
        severity: MAJOR
        requirement: "구버전·unknown field·migration 실패가 명시적이고 원본을 손상하지 않는다."
    minimum_evidence: [raw_run, exported_evidence, hash_manifest]

  - id: QG-04
    name: "재현성·독립 검산"
    required: true
    checks:
      - id: QG-04-01
        severity: BLOCKER
        requirement: "손계산 가능한 fixture로 목적값·제약·비용을 독립 검증한다."
      - id: QG-04-02
        severity: BLOCKER
        requirement: "선택 해의 좌표·커버리지를 원시 유전자/좌표에서 다시 계산해 UI와 일치시킨다."
      - id: QG-04-03
        severity: MAJOR
        requirement: "500m 결과와 250m 추가 검산의 상태·차이를 분리 보고한다."
      - id: QG-04-04
        severity: MAJOR
        requirement: "동일 seed 재현 범위와 시간 제한 solver 등 비결정성 한계를 시험·기록한다."
      - id: QG-04-05
        severity: MAJOR
        requirement: "작은 문제에서 exhaustive/MILP/reference set 중 하나로 교차 검증한다."
      - id: QG-04-06
        severity: MAJOR
        requirement: "알고리즘 비교는 실제 NFE와 준비 비용을 함께 보고한다."
    minimum_evidence: [test_report, raw_run, benchmark]

  - id: QG-05
    name: "오류·중단·저장·복구"
    required: true
    checks:
      - id: QG-05-01
        severity: BLOCKER
        requirement: "중단, timeout, 계산 실패, 서버 종료, 연결 상실, 완료를 구분한다."
      - id: QG-05-02
        severity: BLOCKER
        requirement: "완료 저장은 atomic하며 불완전 실행을 복구 완료로 표시하지 않는다."
      - id: QG-05-03
        severity: MAJOR
        requirement: "재연결 후 완료 실행을 열 수 있고 새 실행이 기존 근거를 손상하지 않는다."
      - id: QG-05-04
        severity: MAJOR
        requirement: "손상 파일, disk 부족, 권한, port 충돌, solver 실패에 행동 가능한 오류가 있다."
      - id: QG-05-05
        severity: MAJOR
        requirement: "강제 종료 시험에서 저장소 일관성과 임시파일 처리를 확인한다."
    minimum_evidence: [test_report, command_log, manual_check]

  - id: QG-06
    name: "상용 UI 디자인·정보구조·사용성"
    required: true
    checks:
      - id: QG-06-01
        severity: BLOCKER
        requirement: "90일 이내 UI_REFERENCE_BRIEF가 있고 최신 연구 콘텐츠·현재 화면 문제를 포함한다."
      - id: QG-06-02
        severity: BLOCKER
        requirement: "공식/실제품 참조 6개 이상을 enterprise 2, scientific/data 2, spatial 1, accessibility/design-system 1 범주로 조사했다."
      - id: QG-06-03
        severity: MAJOR
        requirement: "각 참조의 URL·조사일·채택/비채택 패턴·라이선스 주의를 기록하고 화면을 복제하지 않았다."
      - id: QG-06-04
        severity: BLOCKER
        requirement: "색상 차이가 아닌 정보구조 대안 2개 이상을 비교하고 선택 근거를 남겼다."
      - id: QG-06-05
        severity: BLOCKER
        requirement: "PDF의 긴 단일 페이지와 내부 구성요소 나열 구조를 유지하지 않고 사용자 과업 중심 화면으로 재구성했다."
      - id: QG-06-06
        severity: MAJOR
        requirement: "고정 app shell, 명확한 현재 위치, 일관된 page header, 화면별 단일 primary action이 있다."
      - id: QG-06-07
        severity: BLOCKER
        requirement: "지도/plot/결과가 주 작업공간을 차지하고 설명·고급 설정은 context panel/drawer/help로 단계적 공개된다."
      - id: QG-06-08
        severity: MAJOR
        requirement: "실행 dashboard, 실험 설정, monitor, solution explorer, compare/evidence가 분리되거나 동등한 과업 구조를 갖는다."
      - id: QG-06-09
        severity: BLOCKER
        requirement: "목록·plot·지도·inspector의 선택, filter, 세대 문맥이 양방향 동기화된다."
      - id: QG-06-10
        severity: MAJOR
        requirement: "design token과 component state contract가 있으며 임의 스타일·중첩 카드·혼합 icon을 누적하지 않는다."
      - id: QG-06-11
        severity: MAJOR
        requirement: "새 센서·목적·제약은 schema/metadata 기반 목록·필터·열·상세 패널에 흡수되고 메뉴/카드가 무한 증가하지 않는다."
      - id: QG-06-12
        severity: BLOCKER
        requirement: "실제 데이터로 핵심 5개 과업을 end-to-end 검증하며 mock/placeholder를 실제 기능처럼 제출하지 않는다."
      - id: QG-06-13
        severity: BLOCKER
        requirement: "대표 사용자 5명 이상 평가에서 핵심 과업 성공률 90% 이상, 치명 오조작 0건이거나 승인된 전문 대체 평가가 있다."
      - id: QG-06-14
        severity: MAJOR
        requirement: "1920x1080, 1440x900, 1280x720, 200% 확대에서 실제 screenshot을 검토했다."
      - id: QG-06-15
        severity: MAJOR
        requirement: "첫 viewport에서 화면 목적·상태·주 행동·핵심 결과가 보이고 긴 설명문이 핵심 작업을 밀어내지 않는다."
      - id: QG-06-16
        severity: MAJOR
        requirement: "empty/loading/error/disabled/selected/focus 상태가 의도적으로 설계되어 있다."
      - id: QG-06-17
        severity: BLOCKER
        requirement: "WCAG 2.2 AA 목표 자동·수동 검사, keyboard flow, chart/map 대체 표현이 통과한다."
      - id: QG-06-18
        severity: MAJOR
        requirement: "핵심 화면의 visual regression 또는 동등한 before/after review 증거가 있다."
      - id: QG-06-19
        severity: MAJOR
        requirement: "UI 전문가 또는 사용자 책임자가 실제 화면을 보고 문서형 시제품이 아님을 승인했다."
      - id: QG-06-20
        severity: BLOCKER
        requirement: "PRODUCT_QUALITY_STANDARD의 UI 금지 안티패턴이 핵심 화면에 없다."
      - id: QG-06-21
        severity: MAJOR
        requirement: "공통 계산 설정의 표시값을 실제 제출·원시 solver 값과 대조한다. NSGA-III는 목적 수 M, 분할 h, H=C(M+h-1,M-1), 개체 수 관계·NSGA-II 미사용·저장 설정 보존을 검증하고 잘못된 H 주입이 실패해야 한다."
      - id: QG-06-22
        severity: MAJOR
        requirement: "센서 위치는 색 외에 모양·문자로 구분하며 범위선·범례가 일치한다. 실제 raw X 설치 수, 동시 설치, 기본·비교·확대·레이어 화면을 검사하고 동일 기호 주입을 검출한다. 스크린샷 생성만으로 가독성 PASS를 부여하지 않는다."
      - id: QG-06-23
        severity: MAJOR
        requirement: "확정 설정은 사람이 읽는 이름·단위·순서·예산 표로 조회되고 원본 JSON은 고급 보기다. JSON-only 주입을 검출하며 모델 전환·저장 복원 후에도 동일 기준을 적용한다."
      - id: QG-06-24
        severity: MAJOR
        requirement: "새 시나리오의 정량 목표는 미설정이며 저장 목표·자원과 편집 초안을 구분한다. 미설정 목표 필터와 낡은 군집을 주입해 전체 해 복구를 검사한다. 평가 수·비지배 배치 수·필터 통과 수를 구분하며 빈 archive는 원시 G 제약 원인과 archive 밖의 진단 후보로 설명한다. 목적 부분집합·순서·저장 복원을 원시 X/F/G와 대조한다."
      - id: QG-06-25
        severity: MAJOR
        requirement: "전량 사용에서 비지배 해가1개인 실제 사례로 관측된 실현가능 고유 배치 전체와 비지배 집합을 구분하고 모든 페이지를 원시 ID/X/F/G/설치 수와 대조한다. 전체 정렬·필터 후 페이지화, 같은 F의 다른 X, 세대 경계, 비교·확대의 페이지 이동과 복원, 잘못된 조회·통신 실패를 검증한다. 지배된 배치를 Pareto로 바꾸거나 페이지 내 군집을 전체 군집으로 표시하지 않는다."
      - id: QG-06-26
        severity: MAJOR
        requirement: "관측 비지배 개수와 전역 해집합 주장을 구분하고 비용 우선·동일 비용 Hamming 대표추출을 독립 검산한다. 정량 목표 미설정에서도 설치 위치 안/밖과 명목 범위 교차를 별도 필터로 제공하고 전체 모집합에 먼저 적용한다. 빈 설치·경계·미제공 영역·필터 해제·비교 캐시·확대 동기화와 원시 불변을 검증한다."
      - id: QG-06-27
        severity: BLOCKER
        requirement: "사용자가 지정한 설치 영역 제한은 사후 결과 필터로 대체하지 않는다. 무작위/Greedy/MILP와 모든 세대의 원시 X가 영역/정확 재고 조건을 만족하고 고정 비용 외 목적이 실제 평가·탐색됨을 검증한다. 목표 선택과 독립, 용량 부족 사전 거부, 공통 지도 제외 후보 표시, 과거 실행 구분, 저장 domain 해시와 재컴파일 복원·변조 거부를 확인한다."
      - id: QG-06-28
        severity: BLOCKER
        requirement: "설치 영역은 UI 선택만으로 보장하지 않는다. API 생략·하위 service/session·역사적 복사·같은 요청 ID의 다른 domain·snapshot 불일치·목적 순서 변경을 음성 회귀검사한다. 모든 연결 모델의 영역/재고/목표 독립 행렬과 원시 X 독립 검산을 R04/R06에 연결한다. 운영 구조 PASS와 수학적 문제 충족을 구분한다."
      - id: QG-06-29
        severity: BLOCKER
        requirement: "모든 연결 모델의 공통 해품질·검산 진입점에서 저장 결과로 삭제·이동·제약·목표 통과 검사를 실행하고 개선 배치 지도·내보내기·재시작 복원을 검증한다. 파일 존재나 버튼 활성화만으로 완료하지 않는다. replay 불일치는 ERROR와 개선 증거 격리, 예산 소진은 PARTIAL, 코드·원시·입력 변경은 이어하기 거부로 검증한다. MILP 근사와 적용 가능한 exact/ε 증명을 구분한다."
      - id: QG-06-30
        severity: BLOCKER
        requirement: "새 공통 검산은 평가·시간 예산이나9비트 한도로 중단하지 않는다. 선택 범위 전체를 완료하거나 사용자 중지/오류/서버 중단으로 명시한다. 모델1~3 동일 방법 registry, 전 이웃 MILP·ε와 전체 이산공간의 범위 차이, manifest/배치 순서·해시·원시 결속, 취소·재개, 과거 기록, 실제 UI와 저장 복원을 검증한다. 100개 화면 페이지·32개 Model 배치는 종료 조건이 아니다."
      - id: QG-06-31
        severity: BLOCKER
        requirement: "최신 사용자 정의는 전체 설치 후보에서 정확한 수량을 선택하고 평가영역 커버 성능을 최적화한다. 평가영역을 설치 중심 hard constraint로 혼동하지 않는다. 외부 중심의 유효 커버 배치, 목표 ON/OFF 수량·후보 독립, 유효 F와 참조방향 차원, 상수 비용 계약 증거, seed 결속 repair의 후보 번호 편향, 기본 Pareto 표시와 별도 관측100 배치를 모델1~3 실제 실행으로 검증한다. 과거 inside-only 기준은 최신 지시의 근거로 재사용하지 않는다."
      - id: QG-06-32
        severity: MAJOR
        requirement: "엄격한 performance100은 선택 성능·나머지 성능·동률 Hamming 순서를 유지한다. 최신 사용자 기본 primary100은 서로 다른 주목적 원시 값별 대표를 먼저 고르고 같은 값에서 max-min Hamming으로 중복 X 없이 선택한다. 보조 목적은 대표 선택 순위를 바꾸지 않는다. 주목적 값이 100개보다 많으면 좋은 값 100개 우선이라는 범위를 설명한다. 모델1~3 값 수준 다양성·최소 Hamming·방향·단위·원시 ID와 기본/확대 지도를 검사한다."
      - id: QG-06-33
        severity: MAJOR
        requirement: "목표 통과 0개인 실제 계산 중에도 checkpoint 원시 population_ids에 결속된 탐색 배치와 미달 상태를 표시한다. 현재 세대와 누적 Pareto를 혼동하지 않는다. 같은 세대 반복 polling에서 선택 행과 지도 DOM을 보존하고 계산 중 누적 대표 추출을 수행하지 않는다. 모델1~3 실제 복수 세대·원시 수량/ID·기본/확대 지도와 동일 checkpoint 부정 회귀를 근거로 남긴다."
      - id: QG-06-34
        severity: MAJOR
        requirement: "품질·근거 탭은 저장 조건에 결속된 선택 해의 성능·초기/관측 최선·제약·목표·중복 평가·구조 다양성과 검산 판정의 의미를 읽을 수 있게 제공한다. 버튼 또는 표 존재만으로 통과하지 않는다. 목표 OFF, 단일 해, 미완료/오류 검산, 제약 미달 우수 수치, 잘못된 run 응답과 늦은 응답을 부정 회귀하고, 실제 개선 배치의 전후 값·원시 ID·지도를 확인한다. 최종 실행 통계와 선택 세대를 구분한다."
      - id: QG-06-35
        severity: MAJOR
        requirement: "해집합 품질은 논문·계산식·고정 척도·참조 출처와 연결하고 실제 예산별 변화 및 반복 변동을 계산한다. 참조 대비 100%를 최적 확률로 표시하지 않는다. 반복 비교는 실제 seed·고유 run·동일 과학 계약·같은 예산을 검증하며 상수 축·빈 참조·제약 미달을 부정 시험한다. 수학 지표와 실제 성능 단위를 함께 표시하고 사람이 개선량과 비교 범위를 읽는 브라우저 근거를 요구한다."
      - id: QG-06-36
        severity: MAJOR
        requirement: "품질 화면은 저장 실행의 조건·탐색 성과·반복 변동·직접 개선 가능성을 연결한 결론으로 시작한다. 목적별 극값을 합친 가상 개선해를 거부하고 실제 같은 X/F 행으로 비교한다. 원본 제외 반복 빈도와 전역 확률을 구분한다. 최종 전체 검산 기본값, 실제 원해/개선해 성능·지도·출처, 목표 미설정/미달·반복 없음·검산 없음 설명을 세 모델에서 검증한다. 지표 표 존재만으로 설명 품질 PASS를 부여하지 않는다."
      - id: QG-06-37
        severity: MAJOR
        requirement: "최종 목표 통과·최종 전체·세대 이력·관측 배치·검산 개선을 구분한다. 실제 원시 집계와 기본 진입/확대 지도/세대 재생을 대조하고 지연·실패·역순 응답에서 이전 페이지를 새 조건으로 표시하지 않는다. 조회 중/실패를 0개로 표시하지 않고 과거 세대 개수를 최종으로 부르지 않는다. 모델1/2/3 공통 검사를 요구한다."
      - id: QG-06-39
        severity: MAJOR
        requirement: "해품질 요약의 각 주장은 동일 실행의 계산·모집단·검사 범위와 직접 연결한다. 개선 발견 평가행/고유X/개선원해/목표통과X를 구분하고 동일 개선X의 중복 발견을 부정 시험한다. 목표OFF·미달·부분/오류 검산·반복 없음·비유한F/G에서 과장 판정을 금지한다. 과거 격자민감도와 독립 수식검증의 현재 계약 적용 여부를 명시한다. 실제 근거 버튼에서 해당 계산·원시다운로드·검산 대상까지 이동하고 세 모델·좁은화면에서 검증한다. 일반 초심자 이해도는 별도 사용자 시험이며 자동검사로 대체했다고 주장하지 않는다."
      - id: QG-06-38
        severity: MAJOR
        requirement: "사용자가 현재 집합의 포함 의미, 선택행의 목표 여유/부족과 순위 기준, 최종집합과 실제 검사범위를 구분할 수 있게 설명한다. 품질은 질문/저장 계산의 답/근거 의미를 연결하고 원표는 문맥 상세에 보존한다. 과거 checkpoint, 고정비용, 목표OFF, 선택없음, 저장 개선기록 접근을 실제 브라우저에서 검사한다. 카드·버튼·데이터 존재만으로 설명 품질을 통과시키지 않는다."
    minimum_evidence: [design_brief, reference_research, prototype, screenshot, usability_report, visual_regression]

  - id: QG-07
    name: "보안·개인정보·로컬 경계"
    required: true
    checks:
      - id: QG-07-01
        severity: BLOCKER
        requirement: "기본 server bind는 loopback이며 외부 공개에는 명시적 보호가 필요하다."
      - id: QG-07-02
        severity: BLOCKER
        requirement: "path traversal, arbitrary file access, command injection, unsafe deserialization을 방지한다."
      - id: QG-07-03
        severity: MAJOR
        requirement: "입력 형식·범위·크기와 요청 자원 한계를 server에서도 검증한다."
      - id: QG-07-04
        severity: MAJOR
        requirement: "의존성 취약점 검사와 치명/높음 취약점 조치 근거가 있다."
      - id: QG-07-05
        severity: MAJOR
        requirement: "비밀·PII·불필요한 절대경로를 공유 로그와 export에 남기지 않는다."
    minimum_evidence: [test_report, command_log, risk_record]

  - id: QG-08
    name: "성능·자원·장시간 안정성"
    required: true
    checks:
      - id: QG-08-01
        severity: MAJOR
        requirement: "준비, evaluator, algorithm overhead, total, NFE, peak memory를 기준 환경에서 측정한다."
      - id: QG-08-02
        severity: MAJOR
        requirement: "지원 최대 후보지/H/population/generation/저장 실행 수가 합의 예산을 만족한다."
      - id: QG-08-03
        severity: MAJOR
        requirement: "계산 중 UI 진행·중단·탐색이 응답성을 유지한다."
      - id: QG-08-04
        severity: MAJOR
        requirement: "반복 실행·세대 재생·view 전환에서 memory/handle/temp 누수가 기준 이내다."
      - id: QG-08-05
        severity: MINOR
        requirement: "성능 머신·환경·표본 수·변동성을 보고한다."
    minimum_evidence: [benchmark, command_log]

  - id: QG-09
    name: "호환성·설치·배포"
    required: true
    checks:
      - id: QG-09-01
        severity: BLOCKER
        requirement: "지원 OS/browser와 최소 요구사항에서 clean install 시험이 통과한다."
      - id: QG-09-02
        severity: MAJOR
        requirement: "dependency가 잠겨 있고 offline/proxy/누락 실패가 설명 가능하다."
      - id: QG-09-03
        severity: MAJOR
        requirement: "START_LIVE_UI.cmd 또는 동등 진입점이 중복 실행·port 충돌·기존 server를 안전하게 처리한다."
      - id: QG-09-04
        severity: MAJOR
        requirement: "업데이트·제거가 저장 실행을 임의 삭제하지 않는다."
      - id: QG-09-05
        severity: MAJOR
        requirement: "배포 manifest와 SHA-256이 있고 개발용 secret/cache가 제외된다."
    minimum_evidence: [test_report, hash_manifest, manual_check]

  - id: QG-10
    name: "사용자·운영·연구 문서"
    required: true
    checks:
      - id: QG-10-01
        severity: MAJOR
        requirement: "설치·시작·종료·업데이트·제거·문제해결 절차가 실제 패키지와 일치한다."
      - id: QG-10-02
        severity: BLOCKER
        requirement: "목적·제약·표본·합성 데이터/비용·최적성 한계·해 선택 의미를 설명한다."
      - id: QG-10-03
        severity: MAJOR
        requirement: "저장·복구 범위와 실행 중 server 종료 후 resume 한계를 명시한다."
      - id: QG-10-04
        severity: MAJOR
        requirement: "raw/export manifest와 재검산 방법을 설명한다."
      - id: QG-10-05
        severity: MAJOR
        requirement: "UI 도움말은 현재 연구 상태와 일치하고 장문 문서는 핵심 작업공간을 점유하지 않는다."
    minimum_evidence: [manual_check, decision_record]

  - id: QG-11
    name: "자동 시험·회귀·접근성"
    required: true
    checks:
      - id: QG-11-01
        severity: BLOCKER
        requirement: "unit, integration, end-to-end 시험이 모두 실행되고 실패·오류가 0이다."
      - id: QG-11-02
        severity: BLOCKER
        requirement: "목적식·coverage·제약·수선·NSGA-III·저장·ID 연결에 regression test가 있다."
      - id: QG-11-03
        severity: MAJOR
        requirement: "golden 결과와 screenshot baseline은 이유·검토 없이 자동 갱신되지 않는다."
      - id: QG-11-04
        severity: MAJOR
        requirement: "skip, xfail, flaky retry가 목록과 사유 없이 통과로 숨지 않는다."
      - id: QG-11-05
        severity: MAJOR
        requirement: "자동 accessibility 검사와 keyboard/screen-reader 수동 검사를 함께 수행한다."
      - id: QG-11-06
        severity: MINOR
        requirement: "과학 계산 module coverage와 미포함 위험을 보고한다."
    minimum_evidence: [test_report, coverage_report, command_log, visual_regression]

  - id: QG-12
    name: "최종 증거·잔여 위험·완료 판정"
    required: true
    checks:
      - id: QG-12-01
        severity: BLOCKER
        requirement: "보고서가 QUALITY_REPORT.schema.json 2.0.1 검증을 통과한다."
      - id: QG-12-02
        severity: BLOCKER
        requirement: "모든 필수 gate가 PASS 또는 승인된 NOT_APPLICABLE이며 FAIL/NOT_RUN/BLOCKED가 없다."
      - id: QG-12-03
        severity: BLOCKER
        requirement: "미해결 BLOCKER/MAJOR가 없고 MINOR waiver에는 승인·기한·tracking ID가 있다."
      - id: QG-12-04
        severity: MAJOR
        requirement: "최종 배포물과 시험·screenshot·사용성 평가 대상 revision이 동일하다."
      - id: QG-12-05
        severity: MAJOR
        requirement: "최종 패키지에서 install smoke, 핵심 5개 과업, export 검산을 재실행했다."
      - id: QG-12-06
        severity: BLOCKER
        requirement: "design_evidence가 완전하고 QG-06 PASS 근거를 포함한다."
      - id: QG-12-07
