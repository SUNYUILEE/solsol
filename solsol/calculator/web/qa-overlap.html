<!doctype html><html lang="ko"><meta charset="utf-8"><title>Overlap viewport verification fixture</title>
<style>body{margin:12px;font:14px system-ui;background:#dfe7ed}button,select{min-height:40px}iframe{display:block;border:0;background:white}pre{position:absolute;left:820px;top:70px;width:500px;white-space:pre-wrap}</style>
<label>검사 폭 <select id="width"><option>320</option><option selected>390</option><option>768</option></select></label><button id="open">겹친 점 선택창</button><button id="measure">측정</button><button id="close">닫기</button><p>검증용 실제 페이지 프레임 · 버튼은 DOM 클릭을 발생시킵니다. 새 계산은 실행하지 않습니다.</p>
<iframe id="app" title="실제 프로그램 좁은 화면 검사" width="390" height="650" src="live.html?run=4949f0c0-e743-46ed-a2d4-d5185b1735b9"></iframe><pre id="readout"></pre>
<script>
const app=document.getElementById('app');document.getElementById('width').onchange=e=>app.width=e.target.value;
document.getElementById('open').onclick=()=>{const d=app.contentDocument,w=app.contentWindow,t=d.getElementById('chartType');t.value='3d';t.dispatchEvent(new w.Event('change',{bubbles:true}));const n=d.querySelector('#scatter [data-id="3662"]');n.scrollIntoView({block:'center'});const r=n.getBoundingClientRect();n.dispatchEvent(new w.MouseEvent('click',{bubbles:true,clientX:r.x+r.width/2,clientY:r.y+r.height/2}));};
document.getElementById('close').onclick=()=>app.contentDocument.getElementById('pointPickerClose').click();
document.getElementById('measure').onclick=()=>{const d=app.contentDocument,w=app.contentWindow,p=d.getElementById('pointPicker'),c=d.getElementById('pointPickerClose'),r=p.getBoundingClientRect(),cr=c.getBoundingClientRect(),hit=d.elementFromPoint(cr.x+cr.width/2,cr.y+cr.height/2),table=p.querySelector('.tableWrap');document.getElementById('readout').textContent=JSON.stringify({width:w.innerWidth,rootWidth:d.documentElement.clientWidth,rootScroll:d.documentElement.scrollWidth,open:p.open,dialog:{x:r.x,right:r.right,y:r.y,bottom:r.bottom},closeHit:!!hit&&(hit===c||c.contains(hit)),titleColor:w.getComputedStyle(d.getElementById('pointPickerTitle')).color,table:table?{client:table.clientWidth,scroll:table.scrollWidth,overflow:w.getComputedStyle(table).overflowX}:null,buttons:[...p.querySelectorAll('button')].map(b=>({text:b.textContent,height:b.getBoundingClientRect().height})),ids:[...d.querySelectorAll('#pointPickerRows button')].map(b=>+b.dataset.pickId)},null,2);};
</script></html>
